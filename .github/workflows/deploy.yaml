name: Deploy GenzPlayZone

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GENZPLAYZONE_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.GENZPLAYZONE_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.GENZPLAYZONE_EC2_USER }}@${{ secrets.GENZPLAYZONE_EC2_HOST }} << EOF
          set -e

          cd /home/ubuntu/genzplayzone_backend

          git fetch origin
          git reset --hard origin/main
          git clean -fd

          docker network create genzplayzone-network || true

          # Stop existing compose project
          docker compose \
            -p genzplayzone \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            down || true

          # Remove old containers if they still exist
          docker rm -f genzplayzone-backend genzplayzone-postgres 2>/dev/null || true

          # Start services
          docker compose \
            -p genzplayzone \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            up -d --build --remove-orphans postgres backend

          docker image prune -f
          EOF