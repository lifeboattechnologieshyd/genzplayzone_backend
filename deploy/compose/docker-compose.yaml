services:
  postgres:
    image: postgres:17
    container_name: genzplayzone-postgres
    restart: unless-stopped

    env_file:
      - ../../.env.docker

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGSSLMODE: ${PGSSLMODE:-disable}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - genzplayzone-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: genzplayzone-backend:latest

    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      tags:
        - genzplayzone-backend:latest

    container_name: genzplayzone-backend
    restart: unless-stopped

    env_file:
      - ../../.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-8013}:8000"

    networks:
      - genzplayzone-network

    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:

networks:
  genzplayzone-network:
    external: true